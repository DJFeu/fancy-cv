<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adam Hung - Interactive Resume</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Courier New', monospace;
      background: #000;
      overflow-x: hidden;
      position: relative;
    }

    /* 3D Matrix Background */
    #matrix-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Terminal Container */
    #terminal {
      position: relative;
      z-index: 10;
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* Terminal Window */
    .terminal-window {
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid #00ff00;
      border-radius: 10px;
      box-shadow: 0 0 40px rgba(0, 255, 0, 0.5), inset 0 0 20px rgba(0, 255, 0, 0.1);
      overflow: hidden;
      backdrop-filter: blur(10px);
    }

    /* Terminal Header */
    .terminal-header {
      background: linear-gradient(90deg, #1a1a1a, #2a2a2a);
      padding: 10px 15px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid #00ff00;
    }

    .terminal-buttons {
      display: flex;
      gap: 8px;
    }

    .terminal-button {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      cursor: pointer;
    }

    .close { background: #ff5f56; }
    .minimize { background: #ffbd2e; }
    .maximize { background: #27c93f; }

    .terminal-title {
      flex: 1;
      text-align: center;
      font-size: 14px;
      color: #00ff00;
      text-shadow: 0 0 5px #00ff00;
    }

    /* Terminal Body */
    .terminal-body {
      padding: 30px;
      min-height: 400px;
    }

    /* Typing Text Styles */
    .prompt {
      color: #00ff00;
      margin-right: 8px;
      text-shadow: 0 0 3px #00ff00;
    }

    .typing-container {
      margin-bottom: 20px;
      font-size: 16px;
      line-height: 1.8;
    }

    h1.typed {
      font-size: 48px;
      color: #00ffff;
      text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff;
      margin-bottom: 15px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    h2.typed {
      font-size: 20px;
      color: #ffff00;
      text-shadow: 0 0 10px #ffff00, 0 0 20px #ffff00;
      margin-bottom: 25px;
      letter-spacing: 1px;
    }

    p.typed {
      font-size: 16px;
      color: #00ff00;
      line-height: 1.8;
      max-width: 100%;
      text-shadow: 0 0 3px #00ff00;
    }

    /* Skills and Experience sections */
    pre.typed {
      font-family: 'Courier New', monospace;
      font-size: 14px;
      color: #00ff00;
      line-height: 1.6;
      text-shadow: 0 0 3px #00ff00;
      white-space: pre-wrap;
      margin: 20px 0;
    }

    .skills-section, .experience-section, .current-section {
      border-left: 3px solid #00ff00;
      padding-left: 20px;
      margin: 25px 0;
    }

    .contact-section {
      border: 1px solid #00ff00;
      padding: 15px;
      border-radius: 5px;
      background: rgba(0, 255, 0, 0.05);
      margin: 25px 0;
    }

    .contact-section a {
      color: #00ffff;
      text-decoration: none;
      transition: all 0.3s;
    }

    .contact-section a:hover {
      color: #ffffff;
      text-shadow: 0 0 10px #00ffff;
    }

    /* Kelly Formula */
    .kelly-formula {
      margin-top: 30px;
      padding: 20px;
      border: 2px solid #ff0000;
      border-radius: 10px;
      text-align: center;
      background: rgba(255, 0, 0, 0.1);
      display: none;
    }

    .formula-text {
      font-size: 28px;
      color: #ff0000;
      font-weight: bold;
      font-family: 'Courier New', monospace;
      animation: redPulse 1.5s infinite;
      display: block;
      margin-bottom: 10px;
    }

    .formula-desc {
      font-size: 14px;
      color: #ff6666;
      font-style: italic;
    }

    @keyframes redPulse {
      0%, 100% { 
        text-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000;
        opacity: 1;
      }
      50% { 
        text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000;
        opacity: 0.7;
      }
    }

    /* Cursor Animation */
    .cursor {
      display: inline-block;
      width: 10px;
      height: 20px;
      background: #00ff00;
      margin-left: 3px;
      animation: blink 1s infinite;
      vertical-align: text-bottom;
      box-shadow: 0 0 10px #00ff00;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    /* Music Control */
    .music-control {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 100;
      background: rgba(0, 0, 0, 0.9);
      border: 1px solid #00ff00;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
      cursor: pointer;
      transition: all 0.3s;
    }

    .music-control:hover {
      transform: scale(1.1);
      box-shadow: 0 0 30px rgba(0, 255, 0, 0.8);
    }

    .music-btn {
      background: none;
      border: none;
      color: #00ff00;
      cursor: pointer;
      font-size: 22px;
      transition: all 0.3s;
      text-shadow: 0 0 10px #00ff00;
    }

    /* Loading Screen */
    .loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      transition: opacity 0.5s;
    }

    .loading-text {
      color: #00ff00;
      font-size: 24px;
      animation: pulse 1s infinite;
      text-shadow: 0 0 20px #00ff00;
      margin-bottom: 20px;
    }

    .loading-bar {
      width: 300px;
      height: 3px;
      background: rgba(0, 255, 0, 0.2);
      border: 1px solid #00ff00;
      border-radius: 3px;
      overflow: hidden;
    }

    .loading-progress {
      height: 100%;
      background: #00ff00;
      animation: load 1.5s ease-out;
      box-shadow: 0 0 10px #00ff00;
    }

    @keyframes load {
      from { width: 0%; }
      to { width: 100%; }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* Click to start overlay */
    .start-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 999;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: opacity 0.5s;
    }

    .start-text {
      color: #00ff00;
      font-size: 28px;
      text-shadow: 0 0 20px #00ff00;
      animation: pulse 1.5s infinite;
      text-align: center;
    }

    .start-text small {
      display: block;
      font-size: 16px;
      margin-top: 10px;
      color: #00ffff;
    }

    /* Responsive */
    @media (max-width: 768px) {
      h1.typed { font-size: 32px; }
      h2.typed { font-size: 16px; }
      p.typed { font-size: 14px; }
      .terminal-body { padding: 20px; }
    }
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div class="loading" id="loading">
    <div class="loading-text">INITIALIZING SYSTEM...</div>
    <div class="loading-bar">
      <div class="loading-progress"></div>
    </div>
  </div>

  <!-- Click to Start Overlay -->
  <div class="start-overlay" id="startOverlay" style="display: none;">
    <div class="start-text">
      [ CLICK TO ENTER ]
      <small>Enable sound for full experience</small>
    </div>
  </div>

  <!-- 3D Matrix Background -->
  <canvas id="matrix-canvas"></canvas>

  <!-- Terminal Container -->
  <div id="terminal">
    <div class="terminal-window">
      <div class="terminal-header">
        <div class="terminal-buttons">
          <div class="terminal-button close"></div>
          <div class="terminal-button minimize"></div>
          <div class="terminal-button maximize"></div>
        </div>
        <div class="terminal-title">adam@portfolio ~ $ ./resume.sh</div>
      </div>
      <div class="terminal-body">
        <div class="typing-container">
          <span class="prompt">$</span><span id="cmd1"></span>
        </div>
        <h1 class="typed" id="name"></h1>
        <h2 class="typed" id="title"></h2>
        <p class="typed" id="bio"></p>
        <pre class="typed skills-section" id="skills"></pre>
        <pre class="typed experience-section" id="experience"></pre>
        <pre class="typed current-section" id="current"></pre>
        <pre class="typed contact-section" id="contact"></pre>
        <div class="kelly-formula" id="formula">
          <span class="formula-text">f* = (p × b - q) / b</span>
          <span class="formula-desc">// Kelly Criterion: Optimal position sizing for maximum growth</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Music Control -->
  <div class="music-control" id="muteBtn">
    <button class="music-btn">🔊</button>
  </div>

  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  
  <script>
    // 3D Matrix Rain Effect with Three.js
    const canvas = document.getElementById('matrix-canvas');
    const renderer = new THREE.WebGLRenderer({ 
      canvas: canvas,
      antialias: false,
      alpha: false
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);
    scene.fog = new THREE.Fog(0x000000, 1, 100);

    const camera = new THREE.PerspectiveCamera(
      75,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    camera.position.set(0, 0, 30);

    // Matrix Characters
    const matrixChars = "アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ!@#$%^&*()_+-=[]{}|;:,.<>?";
    const charArray = matrixChars.split('');

    // Create texture for characters
    function createTextTexture(char) {
      const size = 256;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      
      const context = canvas.getContext('2d');
      context.font = 'bold 200px monospace';
      context.fillStyle = '#00ff00';
      context.textAlign = 'center';
      context.textBaseline = 'middle';
      context.fillText(char, size/2, size/2);
      
      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      return texture;
    }

    // Matrix columns
    const columns = 80;
    const rows = 30;
    const spacing = 1.5;
    
    // Create matrix rain particles
    const matrixGroup = new THREE.Group();
    const matrixColumns = [];

    for (let col = 0; col < columns; col++) {
      const column = [];
      const x = (col - columns/2) * spacing;
      
      for (let row = 0; row < rows; row++) {
        const char = charArray[Math.floor(Math.random() * charArray.length)];
        const geometry = new THREE.PlaneGeometry(1, 1);
        
        // Create material with glow effect
        const material = new THREE.MeshBasicMaterial({
          map: createTextTexture(char),
          transparent: true,
          opacity: 0,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        });
        
        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.set(x, (row - rows/2) * spacing, Math.random() * 10 - 5);
        
        // Store additional properties
        mesh.userData = {
          originalY: mesh.position.y,
          speed: 0.1 + Math.random() * 0.3,
          delay: Math.random() * 100,
          char: char,
          row: row,
          col: col
        };
        
        column.push(mesh);
        matrixGroup.add(mesh);
      }
      matrixColumns.push(column);
    }

    scene.add(matrixGroup);

    // Add bloom light effect
    const pointLight = new THREE.PointLight(0x00ff00, 0.5);
    pointLight.position.set(0, 0, 20);
    scene.add(pointLight);

    // Animation variables
    let time = 0;
    const clock = new THREE.Clock();

    // Matrix animation
    function animateMatrix() {
      requestAnimationFrame(animateMatrix);
      
      const deltaTime = clock.getDelta();
      time += deltaTime;

      // Animate each column
      matrixColumns.forEach((column, colIndex) => {
        column.forEach((mesh, rowIndex) => {
          const userData = mesh.userData;
          
          // Create falling effect
          if (time > userData.delay * 0.1) {
            mesh.position.y -= userData.speed;
            
            // Reset position when reaching bottom
            if (mesh.position.y < -rows/2 * spacing) {
              mesh.position.y = rows/2 * spacing;
              // Change character
              const newChar = charArray[Math.floor(Math.random() * charArray.length)];
              mesh.material.map = createTextTexture(newChar);
              userData.char = newChar;
              userData.speed = 0.1 + Math.random() * 0.3;
            }
            
            // Calculate opacity based on position (trail effect)
            const normalizedY = (mesh.position.y + rows/2 * spacing) / (rows * spacing);
            
            // Head of the trail is bright
            if (rowIndex === 0 || (rowIndex < 3 && Math.random() > 0.5)) {
              mesh.material.opacity = 1;
              mesh.material.color = new THREE.Color(0xffffff);
            } else {
              // Gradient fade
              mesh.material.opacity = normalizedY * 0.8;
              mesh.material.color = new THREE.Color(0x00ff00);
            }
            
            // Add flicker effect
            if (Math.random() > 0.98) {
              mesh.material.opacity = Math.random();
            }
          }
          
          // Z-axis wave motion
          mesh.position.z = Math.sin(time * 2 + colIndex * 0.1) * 2;
          
          // Slight rotation
          mesh.rotation.z = Math.sin(time + colIndex * 0.1) * 0.05;
        });
      });

      // Camera movement
      camera.position.x = Math.sin(time * 0.5) * 5;
      camera.position.y = Math.cos(time * 0.3) * 3;
      camera.lookAt(0, 0, 0);

      // Rotate entire matrix group slightly
      matrixGroup.rotation.y = Math.sin(time * 0.2) * 0.1;
      
      renderer.render(scene, camera);
    }

    animateMatrix();

    // Handle resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Audio System
    let audioContext = null;
    let backgroundOscillator = null;
    let backgroundGain = null;
    let isMuted = false;
    let isAudioInitialized = false;

    function initAudioSystem() {
      if (isAudioInitialized) return;
      
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      isAudioInitialized = true;
      
      // Create background music
      createBackgroundMusic();
    }

    function createBackgroundMusic() {
      // Create multiple oscillators for casino/arcade sound
      const mainOsc = audioContext.createOscillator();
      const bassOsc = audioContext.createOscillator();
      const arpeggioOsc = audioContext.createOscillator();
      
      const mainGain = audioContext.createGain();
      const bassGain = audioContext.createGain();
      const arpeggioGain = audioContext.createGain();
      
      const filter = audioContext.createBiquadFilter();
      
      // Configure oscillators for arcade/casino sound
      mainOsc.type = 'square';
      bassOsc.type = 'triangle';
      arpeggioOsc.type = 'square';
      
      filter.type = 'lowpass';
      filter.frequency.value = 2000;
      filter.Q.value = 5;
      
      // Casino-style melody (upbeat and playful)
      const melody = [
        261.63, 329.63, 392.00, 523.25, // C-E-G-C (ascending)
        523.25, 392.00, 329.63, 261.63, // descending
        293.66, 369.99, 440.00, 587.33, // D-F#-A-D
        587.33, 440.00, 369.99, 293.66,
        329.63, 392.00, 493.88, 659.25, // E-G-B-E
        659.25, 493.88, 392.00, 329.63
      ];
      
      // Bass line
      const bassNotes = [130.81, 146.83, 164.81, 146.83]; // C-D-E-D
      
      // Arpeggio pattern (like slot machine sounds)
      const arpeggio = [1046.50, 1318.51, 1567.98, 1318.51]; // High C-E-G-E
      
      let melodyIndex = 0;
      let bassIndex = 0;
      let arpIndex = 0;
      
      // Store oscillators globally for cleanup
      backgroundOscillator = mainOsc;
      backgroundGain = mainGain;
      
      // Play main melody
      function playMelody() {
        if (!isMuted && audioContext && audioContext.state === 'running') {
          const freq = melody[melodyIndex];
          mainOsc.frequency.setValueAtTime(freq, audioContext.currentTime);
          mainGain.gain.setValueAtTime(0.05, audioContext.currentTime);
          mainGain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
          melodyIndex = (melodyIndex + 1) % melody.length;
          
          // Play coin sound effect occasionally
          if (melodyIndex % 8 === 0) {
            playCoinSound();
          }
        }
      }
      
      // Play bass line
      function playBass() {
        if (!isMuted && audioContext && audioContext.state === 'running') {
          const freq = bassNotes[bassIndex];
          bassOsc.frequency.setValueAtTime(freq, audioContext.currentTime);
          bassGain.gain.setValueAtTime(0.03, audioContext.currentTime);
          bassGain.gain.exponentialRampToValueAtTime(0.005, audioContext.currentTime + 0.3);
          bassIndex = (bassIndex + 1) % bassNotes.length;
        }
      }
      
      // Play arpeggio (slot machine-like)
      function playArpeggio() {
        if (!isMuted && audioContext && audioContext.state === 'running') {
          const freq = arpeggio[arpIndex];
          arpeggioOsc.frequency.setValueAtTime(freq, audioContext.currentTime);
          arpeggioGain.gain.setValueAtTime(0.02, audioContext.currentTime);
          arpeggioGain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.05);
          arpIndex = (arpIndex + 1) % arpeggio.length;
        }
      }
      
      // Coin/cash register sound
      function playCoinSound() {
        if (isMuted) return;
        
        const coinOsc = audioContext.createOscillator();
        const coinGain = audioContext.createGain();
        
        coinOsc.type = 'sine';
        coinOsc.frequency.setValueAtTime(2093.00, audioContext.currentTime); // High C
        coinOsc.frequency.exponentialRampToValueAtTime(4186.01, audioContext.currentTime + 0.1); // Higher C
        
        coinGain.gain.setValueAtTime(0.1, audioContext.currentTime);
        coinGain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.2);
        
        coinOsc.connect(coinGain);
        coinGain.connect(audioContext.destination);
        
        coinOsc.start(audioContext.currentTime);
        coinOsc.stop(audioContext.currentTime + 0.2);
      }
      
      // Set up intervals for playback
      setInterval(playMelody, 125); // Fast tempo for arcade feel
      setInterval(playBass, 500);
      setInterval(playArpeggio, 62.5); // Very fast for slot machine effect
      
      // Connect audio nodes
      mainOsc.connect(filter);
      filter.connect(mainGain);
      mainGain.connect(audioContext.destination);
      
      bassOsc.connect(bassGain);
      bassGain.connect(audioContext.destination);
      
      arpeggioOsc.connect(arpeggioGain);
      arpeggioGain.connect(audioContext.destination);
      
      // Start oscillators
      mainOsc.start();
      bassOsc.start();
      arpeggioOsc.start();
      
      // Set initial volumes
      mainGain.gain.value = 0.02;
      bassGain.gain.value = 0.02;
      arpeggioGain.gain.value = 0.01;
    }

    // Typing sound effect
    function playTypingSound() {
      if (!audioContext || isMuted || audioContext.state !== 'running') return;
      
      const duration = 0.03;
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      
      // Mechanical keyboard sound
      osc.type = 'square';
      osc.frequency.value = 1000 + Math.random() * 500;
      
      gain.gain.setValueAtTime(0.02, audioContext.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + duration);
      
      osc.connect(gain);
      gain.connect(audioContext.destination);
      
      osc.start(audioContext.currentTime);
      osc.stop(audioContext.currentTime + duration);
      
      // Add click sound
      const clickOsc = audioContext.createOscillator();
      const clickGain = audioContext.createGain();
      
      clickOsc.type = 'sine';
      clickOsc.frequency.value = 40;
      
      clickGain.gain.setValueAtTime(0.05, audioContext.currentTime);
      clickGain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.01);
      
      clickOsc.connect(clickGain);
      clickGain.connect(audioContext.destination);
      
      clickOsc.start(audioContext.currentTime);
      clickOsc.stop(audioContext.currentTime + 0.01);
    }

    // Typing Effect with Sound and Delete functionality
    function typeWriter(element, text, speed, callback, isWrong = false, correctText = '', deleteDelay = 0) {
      let i = 0;
      element.innerHTML = ''; // Use innerHTML for links
      
      const cursor = document.createElement('span');
      cursor.className = 'cursor';
      element.parentNode.insertBefore(cursor, element.nextSibling);
      
      function type() {
        if (i < text.length) {
          // Check if we're at a URL
          if (text.substring(i).startsWith('https://')) {
            // Find the end of the URL
            let urlEnd = text.indexOf(' ', i);
            if (urlEnd === -1) urlEnd = text.indexOf('\n', i);
            if (urlEnd === -1) urlEnd = text.length;
            
            const url = text.substring(i, urlEnd);
            const link = document.createElement('a');
            link.href = url;
            link.target = '_blank';
            link.textContent = url;
            element.appendChild(link);
            
            // Play typing sound for the whole URL
            playTypingSound();
            i = urlEnd;
          } else {
            // Regular character
            const char = text.charAt(i);
            if (char === '\n') {
              element.appendChild(document.createElement('br'));
            } else {
              element.appendChild(document.createTextNode(char));
            }
            playTypingSound();
            i++;
          }
          
          // Add some randomness to typing speed for realism
          const nextDelay = speed + (Math.random() - 0.5) * speed * 0.5;
          setTimeout(type, nextDelay);
        } else {
          // If this is wrong text, delete it and type correct text
          if (isWrong && correctText) {
            setTimeout(() => {
              deleteAndRetype(element, text, correctText, cursor, callback);
            }, deleteDelay);
          } else {
            setTimeout(() => {
              cursor.remove();
              if (callback) callback();
            }, 500);
          }
        }
      }
      type();
    }

    // Delete and retype function
    function deleteAndRetype(element, wrongText, correctText, cursor, callback) {
      let i = wrongText.length;
      
      // Delete phase
      function deleteChar() {
        if (i > 0) {
          element.textContent = wrongText.substring(0, i - 1);
          playTypingSound();
          i--;
          setTimeout(deleteChar, 50);
        } else {
          // Start typing correct text
          let j = 0;
          function typeCorrect() {
            if (j < correctText.length) {
              element.textContent += correctText.charAt(j);
              playTypingSound();
              j++;
              setTimeout(typeCorrect, 60 + (Math.random() - 0.5) * 30);
            } else {
              setTimeout(() => {
                cursor.remove();
                if (callback) callback();
              }, 500);
            }
          }
          setTimeout(typeCorrect, 200);
        }
      }
      deleteChar();
    }

    // Content to type
    const texts = [
      { id: 'cmd1', text: 'cat resume.txt', speed: 80 },
      { id: 'name', text: 'Adam Hung', speed: 120 },
      { id: 'title', text: 'Extremely gifted pro trader & hacker.', speed: 60, isWrong: true, 
        correctText: 'A not-so-gifted trader and a bit of a loser.', deleteDelay: 1500 },
      { id: 'bio', text: "I'm a developer/trader with a passion for multimedia and trading, equally at home tinkering with code as I am exploring music or the latest in internet tech. I dabble in investing and entrepreneurship, and people usually describe me as calm, kind, and a bit of a debugging detective. I thrive on challenges, enjoy learning new things, and I'm always open to exciting collaborations—whether it's building, breaking, or boldly experimenting with the next big idea.", speed: 30 },
      { id: 'skills', text: '## Core Skills\n> Languages: Swift, Objective-C, Python, JavaScript, SQL, PHP\n> Technologies: Socket Programming, Live Streaming, GPS/Bluetooth, Web Development\n> Platforms: iOS/macOS, Web Apps, Desktop Tools, Crawlers & Automation\n> Trading: MT4/MT5 Administrator, Risk Manager, Quantitative Trader\n> Blockchain: Crypto Exchange Systems, Web3 Development', speed: 20 },
      { id: 'experience', text: '## Experience Highlights\n• 17+ years in Software Development\n• Senior Developer at BitoPro Crypto Exchange (2022-Present)\n• Risk Manager at Phnom Penh Derivative Exchange (2017-2022)\n• iOS Contractor for VoIP, Golf GPS, Wireless Storage Apps\n• Live Casino Gaming Systems Developer (5+ years)\n• Social Network Games Developer (Facebook Games)\n• Educational iPad Apps & Interactive Media', speed: 25 },
      { id: 'current', text: '## Current Projects\n→ Bluetooth Device Integration & AI Applications\n→ B2C Commercial Management Platform\n→ Trading Systems (Grid Trading, Arbitrage Bots)', speed: 30 },
      { id: 'contact', text: '## Contact\n• BattleTag: DjFeu#3832\n• Email: magic.music@gmail.com\n• LINE: https://line.me/ti/p/e_nlMqjEtK\n• Location: Taipei, Taiwan 📍 https://maps.app.goo.gl/7jhT75hEEWpUEoKS8', speed: 40 },
      { id: 'formula', text: '', speed: 0, isFormula: true }
    ];

    // Start typing sequence
    function startTypingSequence() {
      let index = 0;
      function typeNext() {
        if (index < texts.length) {
          const current = texts[index];
          
          // Handle Kelly formula specially
          if (current.isFormula) {
            setTimeout(() => {
              const formulaDiv = document.getElementById('formula');
              formulaDiv.style.display = 'block';
              // Add typing sound effect
              playTypingSound();
              index++;
              typeNext();
            }, 1000);
          } else {
            const element = document.getElementById(current.id);
            typeWriter(element, current.text, current.speed, () => {
              index++;
              setTimeout(typeNext, 700);
            }, current.isWrong, current.correctText, current.deleteDelay);
          }
        }
      }
      setTimeout(typeNext, 500);
    }

    // Mute button handler
    document.getElementById('muteBtn').addEventListener('click', () => {
      isMuted = !isMuted;
      const btn = document.querySelector('.music-btn');
      
      if (backgroundGain) {
        if (isMuted) {
          backgroundGain.gain.setValueAtTime(0, audioContext.currentTime);
          btn.textContent = '🔇';
        } else {
          backgroundGain.gain.setValueAtTime(0.02, audioContext.currentTime);
          btn.textContent = '🔊';
        }
      }
    });

    // Initialize everything
    window.addEventListener('load', () => {
      // Hide loading after animation
      setTimeout(() => {
        const loading = document.getElementById('loading');
        loading.style.opacity = '0';
        setTimeout(() => {
          loading.style.display = 'none';
          // Show start overlay
          document.getElementById('startOverlay').style.display = 'flex';
        }, 500);
      }, 1500);
    });

    // Start on click
    document.getElementById('startOverlay').addEventListener('click', () => {
      // Initialize audio
      initAudioSystem();
      if (audioContext) {
        audioContext.resume();
      }
      
      // Hide overlay
      document.getElementById('startOverlay').style.opacity = '0';
      setTimeout(() => {
        document.getElementById('startOverlay').style.display = 'none';
      }, 500);
      
      // Start typing
      startTypingSequence();
    });

    // Also allow clicking anywhere to start audio if not started
    document.addEventListener('click', () => {
      if (!isAudioInitialized) {
        initAudioSystem();
      }
      if (audioContext && audioContext.state === 'suspended') {
        audioContext.resume();
      }
    });
  </script>
